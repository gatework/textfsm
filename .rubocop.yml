AllCops:
  NewCops: enable
  TargetRubyVersion: 3.1
  SuggestExtensions: false
  Exclude:
    - "vendor/**/*"
    - "tmp/**/*"
    - "pkg/**/*"

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/BlockDelimiters:
  EnforcedStyle: line_count_based

Style/EmptyMethod:
  EnforcedStyle: expanded

Style/MultilineBlockChain:
  Enabled: true

Lint/AmbiguousBlockAssociation:
  Enabled: true

Style/ClassMethodsDefinitions:
  Enabled: true
  EnforcedStyle: def_self

Style/CollectionMethods:
  Enabled: true

Metrics/MethodLength:
  Max: 35
  CountAsOne: [array, hash, heredoc]
  Exclude: ["test/**/*"]

Metrics/AbcSize:
  Max: 45
  Exclude: ["test/**/*"]

Metrics/CyclomaticComplexity:
  Max: 15

Metrics/PerceivedComplexity:
  Max: 15

Metrics/ClassLength:
  Max: 300
  CountAsOne: [array, hash, heredoc]

Metrics/BlockLength:
  CountAsOne: [array, hash, heredoc]
  Exclude: ["test/**/*"]

Style/Documentation:
  Enabled: false

Layout/LineLength:
  Max: 140
  AllowedPatterns: ["\\A\\s*#", "raise .*Error"]

# Registry account policy is configured when publishing, not by this library.
Gemspec/RequireMFA:
  Enabled: false

# StringScanner 3.0 requires Regexp arguments even for single characters.
Style/RedundantRegexpArgument:
  Exclude: ["lib/textfsm/pattern.rb"]
